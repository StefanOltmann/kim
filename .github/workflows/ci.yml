name: Build & Test

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build & Test
    runs-on: macos-26
    steps:
      - name: Checkout workspace
        # actions/checkout v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        timeout-minutes: 5
        with:
          fetch-depth: 0
      - name: Set up Java JDK 17
        # actions/setup-java v4
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Select XCode 26.5
        run: |
          sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
          xcodebuild -version
      - name: Validate Gradle wrapper
        # gradle/actions/wrapper-validation v4
        uses: gradle/actions/wrapper-validation@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - name: Gradle Cache
        # actions/cache v4
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/native
          key: ${{ runner.os }}-gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'build.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-
      - name: Kotlin Native Cache
        # actions/cache v4
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'build.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-konan-
      - name: Android Cache
        # actions/cache v4
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.android
          key: ${{ runner.os }}-android-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'build.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-android-
      - name: Build & Test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x ./gradlew
          ./gradlew build check assembleXCFramework --parallel
      - name: Build Kotlin JVM sample against the last release
        run: |
          chmod +x ./examples/kim-kotlin-jvm-sample/gradlew
          ./examples/kim-kotlin-jvm-sample/gradlew -p examples/kim-kotlin-jvm-sample build
      - name: Build Java sample against the last release
        run: |
          chmod +x ./examples/kim-java-sample/gradlew
          ./examples/kim-java-sample/gradlew -p examples/kim-java-sample build
      - name: Set RELEASE_VERSION variable
        run: |
          echo "RELEASE_VERSION=$(cat build/version.txt)" >> $GITHUB_ENV
          echo ${{ env.RELEASE_VERSION }}
      - name: Upload reports
        # actions/upload-artifact v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reports.zip
          path: build/reports
      - name: Upload unit test reference files
        # actions/upload-artifact v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reference_files.zip
          path: build/*.*
      - name: List files
        run: |
          ls -lah build/bin/*/releaseExecutable build/libs/  build/outputs/aar/ build/XCFrameworks/release/
      - name: Upload kim.jar
        # actions/upload-artifact v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          if-no-files-found: error
          name: kim.jar
          path: build/libs/kim-jvm-${{ env.RELEASE_VERSION }}.jar
      - name: Upload kim.aar
        # actions/upload-artifact v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          if-no-files-found: error
          name: kim.aar
          path: build/outputs/aar/kim.aar
      - name: Upload kim.xcframework
        # actions/upload-artifact v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          if-no-files-found: error
          name: kim.xcframework
          path: build/XCFrameworks/release/kim.xcframework
      - name: Upload kim.exe
        # actions/upload-artifact v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          if-no-files-found: error
          name: kim.exe
          path: build/bin/win/releaseExecutable/kim.exe
      - name: Upload kim-macosArm64.kexe
        # actions/upload-artifact v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          if-no-files-found: error
          name: kim-macosArm64.kexe
          path: build/bin/macosArm64/releaseExecutable/kim.kexe
      - name: Upload kim-win-lib.zip
        # actions/upload-artifact v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          if-no-files-found: error
          name: kim-win-lib.zip
          path: build/bin/win/releaseStatic
      - name: Upload kim-linuxArm64.kexe
        # actions/upload-artifact v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          if-no-files-found: error
          name: kim-linuxArm64.kexe
          path: build/bin/linuxArm64/releaseExecutable/kim.kexe
      - name: Upload kim-linuxX64-lib.zip
        # actions/upload-artifact v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          if-no-files-found: error
          name: kim-linuxX64-lib.zip
          path: build/bin/linuxX64/releaseStatic
      - name: Upload kim-linuxX64.kexe
        # actions/upload-artifact v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          if-no-files-found: error
          name: kim-linuxX64.kexe
          path: build/bin/linuxX64/releaseExecutable/kim.kexe
      - name: Upload kim-linuxArm64-lib.zip
        # actions/upload-artifact v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          if-no-files-found: error
          name: kim-linuxArm64-lib.zip
          path: build/bin/linuxArm64/releaseStatic
      - name: Publish to Maven Central
        if: startsWith(github.ref, 'refs/tags/') # Only for releases
        run: ./gradlew publishToMavenCentral --no-configuration-cache
        env:
          SIGNING_ENABLED: true
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.OSSRH_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.OSSRH_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_SECRET_KEY_RING_FILE_CONTENTS }}

  native-tests:
    name: Native tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    # The native tests never executed in any gate before; keep the new
    # gate advisory until it has proven stable on the runners.
    continue-on-error: true

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            tasks: mingwX64Test
          - os: ubuntu-latest
            tasks: linuxX64Test

    steps:
      - name: Checkout workspace
        # actions/checkout v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        timeout-minutes: 5
      - name: Set up Java JDK 17
        # actions/setup-java v4
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Run native tests
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew ${{ matrix.tasks }} --no-daemon
