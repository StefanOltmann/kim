android.useAndroidX=true
kotlin.code.style=official
kotlin.js.ir.output.granularity=whole-program
kotlin.mpp.applyDefaultHierarchyTemplate=false
kotlin.mpp.enableCInteropCommonization=true
kotlin.mpp.stability.nowarn=true
# The Kotlin/Native link tasks pass -Xbackend-threads with a KGP default of
# 4, which warns "The number of threads is more than the number of
# processors" on 3-core runners. 0 selects the machine's processor count.
kotlin.native.parallelThreads=0
org.gradle.caching=true
org.gradle.jvmargs=-Xmx4g -Dkotlin.daemon.jvm.options\="-Xmx4g"
org.gradle.parallel=true
